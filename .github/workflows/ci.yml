name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Match Pages Vite base (/familyflow/). Uses committed .env.production
          # publishable values only — no secrets in logs.
          GITHUB_ACTIONS: true

      - name: Check relative markdown links
        run: node scripts/check-md-links.mjs
