<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Family Flow — 캐시 초기화</title>
    <style>
      body {
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
        line-height: 1.5;
        color: #0f172a;
      }
      button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 12px;
        background: #0f172a;
        color: #f8fafc;
        padding: 0.85rem 1.1rem;
        width: 100%;
        cursor: pointer;
      }
      p {
        color: #64748b;
      }
      #log {
        white-space: pre-wrap;
        font-size: 0.85rem;
        color: #334155;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>캐시 초기화</h1>
    <p>예전 화면이 남아 있을 때 한 번만 누르세요. 서비스 워커와 사이트 캐시를 지운 뒤 홈으로 이동합니다.</p>
    <button type="button" id="go">캐시 지우고 홈으로</button>
    <div id="log" role="status"></div>
    <script>
      const log = (msg) => {
        document.getElementById('log').textContent += msg + '\n';
      };

      async function clearAll() {
        const base = location.pathname.replace(/clear-cache\.html$/, '');
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
            log('서비스 워커 해제: ' + regs.length);
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
            log('캐시 삭제: ' + (keys.join(', ') || '(없음)'));
          }
        } catch (err) {
          log('오류: ' + (err && err.message ? err.message : String(err)));
        }
        location.replace(base + '?nocache=' + Date.now());
      }

      document.getElementById('go').addEventListener('click', () => {
        document.getElementById('go').disabled = true;
        clearAll();
      });

      // Auto-run so a single visit is enough.
      clearAll();
    </script>
  </body>
</html>
