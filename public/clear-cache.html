<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="robots" content="noindex" />
    <title>Family Flow — 개발용 캐시 초기화</title>
    <style>
      body {
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
        line-height: 1.5;
        color: #0f172a;
      }
      p { color: #64748b; }
      #log {
        white-space: pre-wrap;
        font-size: 0.85rem;
        color: #334155;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>개발용 캐시 초기화</h1>
    <p>
      일반 사용(사파리 홈 화면 추가 웹앱)은 앱을 다시 열면 새 배포를 자동으로 받습니다.
      이 페이지는 개발·디버그용입니다.
    </p>
    <div id="log" role="status">초기화 중…</div>
    <script>
      const log = (msg) => {
        document.getElementById('log').textContent += msg + '\n';
      };

      (async () => {
        const base = location.pathname.replace(/clear-cache\.html$/, '');
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
            log('서비스 워커 해제: ' + regs.length);
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
            log('캐시 삭제: ' + (keys.join(', ') || '(없음)'));
          }
        } catch (err) {
          log('오류: ' + (err && err.message ? err.message : String(err)));
        }
        location.replace(base + '?nocache=' + Date.now());
      })();
    </script>
  </body>
</html>
